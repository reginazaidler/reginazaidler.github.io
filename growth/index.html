<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>המשימות של יובל היום</title><link rel="stylesheet" href="growth.css"></head>
<body><main><header><p class="eyebrow">Growth Agent</p><h1>מה יובל צריך לעשות היום</h1><p>רשימת הזדמנויות שיווקיות ממוקדת. לא אוטומציה של לייקים או Follow - המערכת מוצאת, מדרגת ומציעה פעולה.</p></header>
<section class="stats"><div><b id="count">0</b><span>משימות</span></div><div><b id="doneCount">0</b><span>בוצעו</span></div><div><b id="minutes">0</b><span>דקות</span></div></section>
<div class="filters"><button class="active" data-filter="all">הכל</button><button data-filter="mortgage">ביטוח משכנתא</button><button data-filter="pension">פנסיה</button><button data-filter="insurance">ביטוח</button></div>
<section id="tasks"></section><section class="add"><h2>מצאתי הזדמנות</h2><form id="addForm"><input id="title" placeholder="מה מצאנו?" required><input id="url" type="url" placeholder="לינק למקור" required><select id="topic"><option value="mortgage">ביטוח משכנתא</option><option value="pension">פנסיה</option><option value="insurance">ביטוח</option></select><textarea id="action" placeholder="מה יובל צריך לעשות?" required></textarea><textarea id="reply" placeholder="תגובה מוצעת"></textarea><button type="submit">הוסף למשימות</button></form></section>
</main><script src="growth.js"></script></body></html>
