name: Run Insurance Trends Agent


on:
  workflow_dispatch:
    inputs:
      geo:
        description: 'Google Trends geo code (e.g. IL, US)'
        required: false
        default: 'IL'
      lookback_hours:
        description: 'Comparison window in hours'
        required: false
        default: '6'
      skip_article:
        description: 'Skip article generation (trends report only)'
        required: false
        default: 'false'
      selection_only:
        description: 'Test relevance gate only; never publish an article'
        required: false
        default: 'false'


  schedule:
    # 3 times per week: Sun/Tue/Thu at 08:00 UTC (11:00 Israel time)
    - cron: '0 8 * * 0,2,4'


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


jobs:
  run-insurance-trends-agent:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Run insurance trends agent
        env:
          GEO: ${{ inputs.geo || 'IL' }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '6' }}
        run: |
          python3 scripts/insurance_trends_agent.py \
            --geo "$GEO" \
            --lookback-hours "$LOOKBACK_HOURS"

      - name: Check for new trends
        id: check_trends
        run: |
          python3 - <<'EOF'
          import json, os
          from pathlib import Path
          report = json.loads(Path("reports/insurance-trends-report.json").read_text())
          new_count = len(report.get("changes", {}).get("new", []))
          fallback_count = len(report.get("fallback_article_ideas", []))
          ideas_count = len(report.get("article_ideas", []))
          news_count = len(report.get("news_candidates", []))
          has_content = (new_count + ideas_count + fallback_count + news_count) > 0
          print(f"new={new_count} ideas={ideas_count} fallback={fallback_count} news={news_count}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_content={'true' if has_content else 'false'}\n")
              f.write(f"new_count={new_count}\n")
          EOF

      - name: Validate OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing"
            exit 1
          fi

      - name: Generate SEO article with OpenAI
        id: generate_article
        if: >
          steps.check_trends.outputs.has_content == 'true' &&
          inputs.skip_article != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          EXTRA_ARGS=""
          if [ "${{ inputs.selection_only }}" = "true" ]; then
            EXTRA_ARGS="--selection-only"
          fi
          output=$(python3 scripts/generate_article.py \
            --json-path reports/insurance-trends-report.json \
            --output-dir . $EXTRA_ARGS 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -Fq "No suitable trend found - skipping article generation."; then
              echo "No suitable trend found. Continuing without an article."
            else
              exit "$status"
            fi
          fi

      - name: Test article notifications
        run: python3 -m unittest discover -s scripts/tests -p test_article_notifications.py

      - name: Test index synchronization
        run: python3 -m unittest discover -s scripts/tests -p test_index_sync.py

      - name: Sync sitemap and llms.txt
        run: python3 scripts/sync_indexes.py

      - name: Review, commit and push new files
        id: publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_MODEL: ${{ secrets.REVIEW_MODEL }}
          GENERATED_SLUG: ${{ steps.generate_article.outputs.article_slug }}
        run: |
          git config user.name  "Trends Agent"
          git config user.email "trends-agent@vainzof.co.il"

          git add reports/ data/trends-agent/ sitemap.xml llms.txt articles.html || true

          ARTICLE_SLUG=""
          if [[ "$GENERATED_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] && [ -f "${GENERATED_SLUG}.html" ]; then
            git add -- "${GENERATED_SLUG}.html"
            # An existing/updated page is not a newly published article.
            if [ "$(git diff --cached --diff-filter=A --name-only -- "${GENERATED_SLUG}.html")" = "${GENERATED_SLUG}.html" ]; then
              ARTICLE_SLUG="$GENERATED_SLUG"
            fi
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            python scripts/review_staged_changes.py
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            if [ -n "$ARTICLE_SLUG" ]; then
              git commit -m "auto: trends + article ${ARTICLE_SLUG} [${TIMESTAMP}]"
            else
              git commit -m "auto: trends report update [${TIMESTAMP}]"
            fi
            git push
            # Expose notification data only after publication succeeds.
            if [ -n "$ARTICLE_SLUG" ]; then
              echo "article_slug=$ARTICLE_SLUG" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Send email summary
        if: success() && steps.publish.outputs.article_slug != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.SMTP_TO }}
          from: ${{ secrets.SMTP_FROM }}
          subject: "✅ כתבה חדשה: ${{ steps.publish.outputs.article_slug }}"
          body: |
            נוצרה כתבה חדשה אוטומטית לאתר vainzof.co.il

            כתובת: https://vainzof.co.il/${{ steps.publish.outputs.article_slug }}.html

            GitHub: https://github.com/${{ github.repository }}/blob/main/${{ steps.publish.outputs.article_slug }}.html

            דוח טרנדים: https://github.com/${{ github.repository }}/blob/main/reports/insurance-trends-report.md

            ---
            נשלח אוטומטית על ידי Trends Agent

      - name: Upload trends reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insurance-trends-agent-reports
          path: |
            reports/insurance-trends-report.md
            reports/insurance-trends-report.json
            reports/last-generated-article.json
            reports/orchestrator-decision.json
            data/trends-agent/snapshot_*.json
          if-no-files-found: warn

      - name: Upload code review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-code-review
          path: ${{ runner.temp }}/website-code-review.json
          if-no-files-found: ignore

