name: Sync Sitemap & llms.txt

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-sitemap-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync
        run: python scripts/sync_indexes.py

      - name: Review and push changes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_MODEL: ${{ secrets.REVIEW_MODEL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No sync changes to commit."
            exit 0
          fi

          python scripts/review_staged_changes.py
          git commit -m "chore: auto-sync sitemap and llms.txt"
          # Fail if main moved. A rebase would change the reviewed context.
          git push origin HEAD:main

      - name: Upload code review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-code-review
          path: ${{ runner.temp }}/website-code-review.json
          if-no-files-found: ignore
