name: Sync Sitemap & llms.txt

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-sitemap-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync
        run: python scripts/sync_indexes.py

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No sync changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-sync sitemap and llms.txt"

          # main can move while this workflow is running. Rebase the generated
          # commit onto the latest remote main before pushing.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another commit. Retrying ($attempt/5)..."
            sleep $((attempt * 2))
          done

          echo "Unable to push sync changes after 5 attempts."
          exit 1
