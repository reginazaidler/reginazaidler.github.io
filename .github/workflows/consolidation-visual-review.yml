name: Review article consolidation layouts

on:
  pull_request:
    paths:
      - 'articles.html'
      - 'insurance-double-coverage.html'
      - 'travel-insurance-abroad.html'
      - 'check-insurance-policies.html'
      - 'travel-insurance-check-before-flight.html'
      - 'tsunami-in-japan-insurance-guide.html'
      - 'scripts/check_consolidation_layout.cjs'
      - '.github/workflows/consolidation-visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser in temporary directory
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser" --no-save --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/site-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Validate navigation and inspect desktop/mobile layouts
        env:
          SITE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/site-browser/node_modules/playwright
        run: |
          python3 scripts/check-internal-links.py
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/site-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/check_consolidation_layout.cjs
      - name: Save desktop/mobile screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidation-layout-review
          path: /tmp/consolidation-layout-review
          if-no-files-found: error
          retention-days: 7
