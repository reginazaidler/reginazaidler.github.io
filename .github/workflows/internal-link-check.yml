name: Internal Link Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.html'
      - 'scripts/check-internal-links.py'
      - '.github/workflows/internal-link-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check internal HTML links
        run: python scripts/check-internal-links.py
