name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - work
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enable and confirm HTTPS enforcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pages" \
            -F https_enforced=true)"
          test "$(jq -r '.https_enforced' <<< "$response")" = "true"

      - name: Validate HTTPS SEO signals
        run: python3 scripts/check_https_seo.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed permanent redirects
        run: >-
          python3 scripts/check_https_seo.py
          --check-live-redirect
          --live-attempts 6
          --live-retry-delay 10
