name: Normalize Dashes Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  normalize-dashes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Normalize em dashes in content
        run: python scripts/normalize_dashes.py

      - name: Review and commit updates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_MODEL: ${{ secrets.REVIEW_MODEL }}
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          python scripts/review_staged_changes.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m 'chore: normalize em dashes in site content'
          git push

      - name: Upload code review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-code-review
          path: ${{ runner.temp }}/website-code-review.json
          if-no-files-found: ignore
